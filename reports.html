<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Services Report | AI Portal</title>
  <link rel="icon" type="image/x-icon" href="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=128">
  
  <style>
    /* SHARED THEME VARIABLES */
    :root {
      --bg-color: #0b0f19;
      --glass-bg: rgba(20, 25, 40, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #f87171;
      --safe-color: #34d399;
      --card-bg: rgba(17, 24, 39, 0.75);
      --header-bg: rgba(15, 20, 32, 0.85);
    }
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-primary: #0ea5e9;
      --accent-hover: #0284c7;
      --danger-color: #dc2626;
      --safe-color: #059669;
      --card-bg: rgba(255, 255, 255, 0.85);
      --header-bg: rgba(241, 245, 249, 0.85);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-y: auto; overflow-x: hidden; transition: background-color 0.5s ease; }
    
    .blob { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; animation: float 20s infinite ease-in-out; }
    .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(56, 189, 248, 0.2); }
    .blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: rgba(129, 140, 248, 0.15); animation-delay: -5s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(5%, 10%) scale(1.1); } 66% { transform: translate(-5%, -5%) scale(0.9); } }

    .app-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; animation: fadeIn 0.6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .brand-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, var(--text-main), var(--accent-primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
    .action-group { display: flex; gap: 0.7rem; align-items: center; }

    button, .btn { cursor: pointer; border: none; padding: 0 1.25rem; height: 40px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; outline: none; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover)); color: #ffffff; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); transform: translateY(-2px); }
    .btn-outline { background: var(--glass-highlight); color: var(--text-main); border: 1px solid var(--glass-border); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-primary); transform: translateY(-2px); }
    .btn-icon { padding: 0; width: 40px; justify-content: center; }
    .svg-icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* REPORT CANVAS (White Background for Email Emulation) */
    .report-canvas { background: #ffffff; color: #1e293b; border-radius: 16px; padding: 3rem; margin: 0 auto; max-width: 850px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    
    /* TOAST */
    #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
    .toast { background: var(--header-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); color: var(--text-main); padding: 14px 24px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); font-size: 0.85rem; font-weight: 600; animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; border-left: 4px solid var(--accent-primary); display: flex; align-items: center; gap: 10px; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(50px) scale(0.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
    .spin { animation: spin 1s infinite linear; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div id="toastContainer"></div>

  <div class="app-container" id="appMain" style="display: none;">
    <div class="glass-panel">
      <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 1.25rem;">
          <img src="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=64" alt="Logo" style="height: 42px; border-radius: 10px;">
          <div>
            <div class="brand-title">Weekly Services Report</div>
            <div class="brand-subtitle" id="reportSubtitle">Loading AI Data...</div>
          </div>
        </div>
        <div class="action-group">
          <a href="index.html" class="btn-outline">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Dashboard
          </a>
          <button class="btn-outline" onclick="exportReportCSV()">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Export CSV
          </button>
          <button class="btn-primary" onclick="triggerEmail()" id="emailBtn">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> Send Email Report
          </button>
        </div>
      </div>
    </div>

    <!-- The actual Email HTML is rendered directly inside this div -->
    <div class="report-canvas" id="reportCanvas">
      <div style="text-align: center; color: #64748b; padding: 4rem;">
        <svg class="svg-icon spin" style="width: 40px; height: 40px; margin-bottom: 10px; color: #0ea5e9;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><path d="M12 2v4" stroke-width="2"></path></svg>
        <p>Crunching weekly metrics...</p>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw3FMh8pUQCoNsFecEnZDTFs9045A7BOa1JUhlw9Y-wYMLJLqW5GHrkye0qD7xP7UR8/exec";
    let rawTicketsData = [];

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('mm_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      const token = localStorage.getItem('mm_ticket_session');
      const expiresAt = localStorage.getItem('mm_ticket_session_expiry');

      if (!token || !expiresAt || new Date().getTime() > parseInt(expiresAt, 10)) {
        alert("Session Expired. Please log in from the main dashboard.");
        window.location.href = "index.html";
        return;
      }

      document.getElementById('appMain').style.display = 'block';
      fetchData(token);
    });

    function fetchData(token) {
      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "getDashboardData", sessionToken: token, forceRefresh: false })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          rawTicketsData = (res.data.tickets || []).filter(t => t && t.id);
          document.getElementById('reportSubtitle').textContent = "Snapshot: " + (res.data.lastRefreshed || "--");
          generateHTMLReport(rawTicketsData);
        } else {
          showToast("Error loading data.");
        }
      })
      .catch(err => showToast("Network error."));
    }

    function generateHTMLReport(tickets) {
      // 1. Filter out closed/resolved tickets
      const activeTickets = tickets.filter(t => {
          const s = (t.status || "").toLowerCase();
          return !['closed', 'resolved', 'closed resolved', 'closed unresolved'].includes(s);
      });

      // 2. Compute Top-Level KPIs
      const openInProgress = activeTickets.filter(t => ['open', 'in progress', 'working on it'].includes((t.status||'').toLowerCase()));
      const relevantServices = activeTickets.filter(t => ['services', 'support'].includes((t.department||'').toLowerCase()));
      
      const now = new Date();
      const awaitingOver24 = activeTickets.filter(t => {
         if ((t.status||'').toLowerCase() !== 'awaiting response') return false;
         const mod = new Date(t.modifiedDate);
         return (now - mod) > (24 * 60 * 60 * 1000);
      });

      // 3. Compute Status Breakdown Table
      const statusCounts = {};
      activeTickets.forEach(t => {
          const s = t.status || 'Unknown';
          statusCounts[s] = (statusCounts[s] || 0) + 1;
      });
      const statusHtml = Object.entries(statusCounts)
          .sort((a,b) => b[1]-a[1])
          .map(([s, c]) => `
            <tr>
              <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0; color: #334155;">${s}</td>
              <td style="text-align: right; font-weight: 700; color: #0f172a; border-bottom: 1px solid #e2e8f0;">${c}</td>
              <td style="text-align: right; color: #64748b; border-bottom: 1px solid #e2e8f0; font-size: 12px; width: 50px;">${((c/activeTickets.length)*100).toFixed(1)}%</td>
            </tr>`)
          .join('');

      // 4. Compute Top 10 Delayed Tickets Table
      const delayed = activeTickets
          .filter(t => (now - new Date(t.modifiedDate)) > (24*60*60*1000))
          .sort((a,b) => new Date(a.modifiedDate) - new Date(b.modifiedDate))
          .slice(0, 10);
      
      const delayedHtml = delayed.map(t => {
          const hrs = Math.floor((now - new Date(t.modifiedDate)) / 3600000);
          const days = Math.floor(hrs / 24);
          const timeStr = days > 0 ? `${days}d ${hrs%24}h` : `${hrs}h`;
          const modStr = new Date(t.modifiedDate).toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
          
          return `
          <tr>
             <td style="padding: 10px 0; border-bottom: 1px solid #e2e8f0;">
               <a href="${t.url}" style="color: #0ea5e9; text-decoration: none; font-weight: 600;">#${t.ticketNumber}</a>
             </td>
             <td style="border-bottom: 1px solid #e2e8f0; color: #334155; font-size: 13px;">${modStr}</td>
             <td style="text-align: right; color: #dc2626; font-weight: 700; border-bottom: 1px solid #e2e8f0;">${timeStr}</td>
          </tr>`;
      }).join('');

      // Build the final Email-Safe HTML structure
      const reportDate = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const emailHtml = `
        <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; max-width: 800px; margin: 0 auto; padding: 0;">
            <div style="margin-bottom: 30px;">
               <h1 style="margin: 0 0 5px 0; color: #0f172a; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Mindmatrix WEEKLY REPORT</h1>
               <p style="margin: 0; color: #64748b; font-size: 14px; font-weight: 500;">Services desk · ${reportDate}</p>
            </div>

            <p style="font-size: 15px; color: #334155; margin-bottom: 25px;">Weekly service-ticket status, the active-work subset and movement since the previous report.</p>

            <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #e2e8f0;">
                <h3 style="margin: 0 0 20px 0; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: 1px;">Current Service Workload</h3>
                <table style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding: 10px 10px 10px 0; text-align: left; border-right: 1px solid #cbd5e1; width: 25%;">
                            <div style="font-size: 32px; font-weight: 800; color: #0ea5e9; line-height: 1;">${openInProgress.length}</div>
                            <div style="font-size: 13px; color: #475569; margin-top: 8px;">Open + In Progress statuses</div>
                        </td>
                        <td style="padding: 10px; text-align: left; border-right: 1px solid #cbd5e1; width: 25%;">
                            <div style="font-size: 32px; font-weight: 800; color: #0ea5e9; line-height: 1;">${relevantServices.length}</div>
                            <div style="font-size: 13px; color: #475569; margin-top: 8px;">Relevant with services desk</div>
                        </td>
                        <td style="padding: 10px; text-align: left; border-right: 1px solid #cbd5e1; width: 25%;">
                            <div style="font-size: 32px; font-weight: 800; color: #dc2626; line-height: 1;">${awaitingOver24.length}</div>
                            <div style="font-size: 13px; color: #475569; margin-top: 8px;">Awaiting response > 24h</div>
                        </td>
                        <td style="padding: 10px 0 10px 15px; text-align: left; width: 25%;">
                            <div style="font-size: 32px; font-weight: 800; color: #0f172a; line-height: 1;">${activeTickets.length}</div>
                            <div style="font-size: 13px; color: #475569; margin-top: 8px;">All listed statuses</div>
                        </td>
                    </tr>
                </table>
            </div>

            <div style="margin-bottom: 40px;">
                <h3 style="margin: 0 0 5px 0; font-size: 16px; color: #0f172a;">Status breakdown</h3>
                <p style="font-size: 13px; color: #64748b; margin: 0 0 15px 0;">${activeTickets.length} tickets across all listed statuses</p>
                <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                    ${statusHtml}
                </table>
            </div>

            <div style="margin-bottom: 30px;">
                <h3 style="margin: 0 0 5px 0; font-size: 16px; color: #0f172a;">Responses beyond 24 hours</h3>
                <p style="font-size: 13px; color: #64748b; margin: 0 0 15px 0;">Time since last ticket modification</p>
                <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                    <tr>
                      <th style="text-align:left; border-bottom:2px solid #cbd5e1; padding-bottom:8px; color:#475569; font-size:12px; text-transform:uppercase;">Ticket ID</th>
                      <th style="text-align:left; border-bottom:2px solid #cbd5e1; padding-bottom:8px; color:#475569; font-size:12px; text-transform:uppercase;">Last modified</th>
                      <th style="text-align:right; border-bottom:2px solid #cbd5e1; padding-bottom:8px; color:#475569; font-size:12px; text-transform:uppercase;">Hours reported</th>
                    </tr>
                    ${delayedHtml}
                </table>
            </div>
            
            <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #94a3b8;">
               Source: Executive AI Ticket Portal. Figures are a prepared email snapshot.
            </div>
        </div>
      `;

      // Render visually on screen so you know exactly what the email will look like!
      document.getElementById('reportCanvas').innerHTML = emailHtml;
    }

    function triggerEmail() {
      const btn = document.getElementById('emailBtn');
      const originalText = btn.innerHTML;
      
      const recipient = prompt("Enter email addresses (comma separated):", localStorage.getItem('mm_report_recipient') || "hariharan.iyer@mindmatrix.net");
      if (!recipient) return;
      localStorage.setItem('mm_report_recipient', recipient);

      btn.innerHTML = `<svg class="svg-icon spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><path d="M12 2v4" stroke-width="2"></path></svg> Sending...`;
      btn.disabled = true;

      const htmlBody = document.getElementById('reportCanvas').innerHTML;
      const token = localStorage.getItem('mm_ticket_session');
      const d = new Date();
      const subject = `Services Open Tickets Report - ${d.getDate()} ${d.toLocaleString('default', { month: 'long' })} ${d.getFullYear()}`;

      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "sendReportEmail", sessionToken: token, htmlBody: htmlBody, subject: subject, recipient: recipient })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) showToast(res.message);
        else showToast("Error: " + res.message);
      })
      .catch(err => showToast("Network error while sending email."))
      .finally(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      });
    }

    function exportReportCSV() {
      if (!rawTicketsData || !rawTicketsData.length) return showToast("No data to export.");
      
      // Request exact columns: Created Time, Ticket Id, Subject, Status, Owner, Email (N/A), Classifications, Module, Priority, Client Name
      let csv = 'Created Time (Ticket),Ticket Id,Subject,Status (Ticket),Ticket Owner,Email (Ticket),Classifications,Module,Priority (Ticket),Client Name\n';
      
      const activeTickets = rawTicketsData.filter(t => {
          const s = (t.status || "").toLowerCase();
          return !['closed', 'resolved', 'closed resolved', 'closed unresolved'].includes(s);
      });

      activeTickets.forEach(t => {
        const row = [ 
           `"${t.createdDate}"`, 
           t.ticketNumber, 
           `"${(t.subject||'').replace(/"/g, '""')}"`, 
           t.status, 
           `"${t.owner}"`, 
           `"N/A"`, // Email is usually hidden/unavailable from pure summary endpoint
           `"${t.classification}"`, 
           `"${t.module}"`, 
           t.priority, 
           `"${t.clientName}"`
        ];
        csv += row.join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Services_Open_Tickets_Report_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
      showToast("Report CSV Downloaded.");
    }

    function showToast(msg) {
       const tc = document.getElementById('toastContainer');
       const t = document.createElement('div');
       t.className = 'toast';
       t.innerHTML = `<svg class="svg-icon" style="color:var(--accent-primary); flex-shrink: 0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg> <div style="flex-grow: 1;">${msg}</div>`;
       tc.appendChild(t);
       setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Trends | AI Portal</title>
  <link rel="icon" type="image/x-icon" href="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=128">

  <style>
    :root {
      --bg-color: #0b0f19;
      --glass-bg: rgba(20, 25, 40, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #f87171;
      --safe-color: #34d399;
      --card-bg: rgba(17, 24, 39, 0.75);
      --header-bg: rgba(15, 20, 32, 0.85);
      --table-hover: rgba(255, 255, 255, 0.04);
    }
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(0, 0, 0, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-primary: #0ea5e9;
      --accent-hover: #0284c7;
      --danger-color: #dc2626;
      --safe-color: #059669;
      --card-bg: rgba(255, 255, 255, 0.85);
      --header-bg: rgba(241, 245, 249, 0.85);
      --table-hover: rgba(0, 0, 0, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-y: auto; overflow-x: hidden; transition: background-color 0.5s ease; }

    .blob { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; animation: float 20s infinite ease-in-out; }
    .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(56, 189, 248, 0.2); }
    .blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: rgba(129, 140, 248, 0.15); animation-delay: -5s; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(5%, 10%) scale(1.1); } 66% { transform: translate(-5%, -5%) scale(0.9); } }

    .app-container { max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; animation: fadeIn 0.6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); }

    .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .brand-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, var(--text-main), var(--accent-primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-subtitle { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
    .action-group { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }

    button, .btn { cursor: pointer; border: none; padding: 0 1.25rem; height: 40px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; outline: none; }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover)); color: #ffffff; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); transform: translateY(-2px); }
    .btn-outline { background: var(--glass-highlight); color: var(--text-main); border: 1px solid var(--glass-border); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-primary); transform: translateY(-2px); }
    .svg-icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none !important; stroke-linecap: round; stroke-linejoin: round; }
    .svg-icon * { fill: none !important; }

    /* DATE PICKER */
    .date-input { background: var(--bg-color); border: 1px solid var(--glass-border); color: var(--text-main); padding: 0 1rem; border-radius: 12px; height: 40px; outline: none; font-size: 0.9rem; font-family: inherit; transition: all 0.3s; }
    .date-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    ::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }
    [data-theme="light"] ::-webkit-calendar-picker-indicator { filter: invert(0); }

    /* TRENDS TABLE */
    .table-container { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--glass-border); background: var(--header-bg); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 1.2rem 1rem; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--glass-border); white-space: nowrap; font-weight: 700; background: rgba(0,0,0,0.2); }
    [data-theme="light"] th { background: rgba(0,0,0,0.03); }
    td { padding: 1.2rem 1rem; border-bottom: 1px solid var(--glass-border); color: var(--text-main); font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--table-hover); }

    /* TOAST */
    #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
    .toast { background: var(--header-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); color: var(--text-main); padding: 14px 24px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); font-size: 0.85rem; font-weight: 600; animation: toastIn 0.4s ease forwards; border-left: 4px solid var(--accent-primary); display: flex; align-items: center; gap: 10px; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(50px) scale(0.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
    .spin { animation: spin 1.2s infinite cubic-bezier(0.5, 0.1, 0.4, 0.9); }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div id="toastContainer"></div>

  <div class="app-container" id="appMain" style="display: none;">
    <div class="glass-panel">
      <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 1.25rem;">
          <img src="https://www.google.com/s2/favicons?domain=mindmatrix.net&sz=64" alt="Logo" style="height: 42px; border-radius: 10px;">
          <div>
            <div class="brand-title">Daily Trends</div>
            <div class="brand-subtitle" id="reportDateSubtitle">Select a date to fetch department metrics</div>
          </div>
        </div>
        <div class="action-group">
          <input type="date" id="datePicker" class="date-input">
          <button class="btn-outline" onclick="fetchYesterday()">Yesterday</button>
          <button class="btn-primary" onclick="fetchTrends()" id="fetchBtn">
            <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> Fetch Data
          </button>
          <a href="index.html" class="btn btn-outline" style="margin-left: 10px; text-decoration: none;">
            <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back
          </a>
        </div>
      </div>
    </div>

    <div class="glass-panel" style="padding: 0; overflow: hidden; display: none;" id="tablePanel">
      <div style="height: 4px; background: linear-gradient(90deg, var(--accent-primary), var(--safe-color)); width: 100%;"></div>
      <div class="table-container" id="trendsTableContainer">
        <!-- Table injected here -->
      </div>
    </div>
    
    <div id="loadingState" style="text-align: center; padding: 4rem; color: var(--text-muted); display: none;">
      <svg class="svg-icon spin" style="width: 40px; height: 40px; margin-bottom: 10px; color: var(--accent-primary);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"></circle><path d="M12 2v4" stroke-width="2"></path></svg>
      <p>Querying Zoho API across 10 departments...</p>
      <p style="font-size: 0.8rem; margin-top: 5px;">This process requires heavy data aggregation and takes approximately 10-15 seconds.</p>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw3FMh8pUQCoNsFecEnZDTFs9045A7BOa1JUhlw9Y-wYMLJLqW5GHrkye0qD7xP7UR8/exec";

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('mm_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      const token = localStorage.getItem('mm_ticket_session');
      if (!token || new Date().getTime() > parseInt(localStorage.getItem('mm_ticket_session_expiry'), 10)) {
        alert("Session Expired. Please log in from the main dashboard.");
        window.location.href = "index.html";
        return;
      }
      document.getElementById('appMain').style.display = 'block';
      
      // Default to yesterday
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      document.getElementById('datePicker').value = yesterday.toISOString().split('T')[0];
    });

    function fetchYesterday() {
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      document.getElementById('datePicker').value = yesterday.toISOString().split('T')[0];
      fetchTrends();
    }

    function fetchTrends() {
      const targetDate = document.getElementById('datePicker').value;
      if (!targetDate) return showToast("Please select a date.");

      const btn = document.getElementById('fetchBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<svg class="svg-icon spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v4"></path></svg> Fetching...`;
      btn.disabled = true;
      
      document.getElementById('tablePanel').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';

      const token = localStorage.getItem('mm_ticket_session');

      fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "getLiveMetrics", sessionToken: token, targetDate: targetDate })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
            document.getElementById('reportDateSubtitle').textContent = "Metrics for " + targetDate;
            renderTable(data.tsv.tsv);
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('tablePanel').style.display = 'block';
            showToast("Daily trends generated successfully.");
        } else {
            showToast("Error: " + data.message);
            document.getElementById('loadingState').style.display = 'none';
        }
      })
      .catch(err => {
        showToast("Network error executing API request.");
        document.getElementById('loadingState').style.display = 'none';
      })
      .finally(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      });
    }

    function renderTable(tsvString) {
      const rows = tsvString.split('\n');
      let tableHtml = '<table>';
      
      rows.forEach((row, i) => {
        let cells = row.split('\t');
        tableHtml += '<tr>';
        cells.forEach(cell => {
            if(i === 0) {
                // Highlight critical headers
                if(cell.includes('New') || cell.includes('Closed') || cell.includes('Total')) {
                    tableHtml += `<th><span style="color: var(--accent-primary);">${cell}</span></th>`;
                } else {
                    tableHtml += `<th>${cell}</th>`;
                }
            } else {
                tableHtml += `<td>${cell}</td>`;
            }
        });
        tableHtml += '</tr>';
      });
      tableHtml += '</table>';
      document.getElementById('trendsTableContainer').innerHTML = tableHtml;
    }

    function showToast(msg) {
       const tc = document.getElementById('toastContainer');
       const t = document.createElement('div');
       t.className = 'toast';
       t.innerHTML = `<svg class="svg-icon" style="color:var(--accent-primary); flex-shrink: 0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg> <div style="flex-grow: 1;">${msg}</div>`;
       tc.appendChild(t);
       setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    }
  </script>
</body>
</html>
